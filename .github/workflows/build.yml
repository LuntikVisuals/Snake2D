name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Accept licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          test -f gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble Debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        if: success()
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/Snake2D-debug.apk
          ls -la release/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: snake2d-debug-apk
          path: release/Snake2D-debug.apk
          retention-days: 14

      - name: Release (only on main push)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Snake2D build ${{ github.run_number }}
          body: |
            Автосборка #${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: release/Snake2D-debug.apk
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
